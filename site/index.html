<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicons -->
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" sizes="48x48" type="image/png" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- iOS PWA Meta Tags -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="tinypeek" />

    <!-- Theme & SEO -->
    <meta name="theme-color" content="#112658" />
    <!-- Each address's own head: the kit's applyHead() replaces what is between these marks with the
         address's title, description and canonical once the app runs. -->
    <!--tc:head-->
    <title>tinypeek</title>
    <meta name="description" content="The tm:// protocol: a read-only URI namespace over MCP, its spec, a browser for it, and the three projects built on it." />
    <meta property="og:title" content="tinypeek" />
    <meta property="og:description" content="The tm:// protocol: a read-only URI namespace over MCP, its spec, a browser for it, and the three projects built on it." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tinypeek.tinymachines.ai/" />
    <meta property="og:image" content="/logo.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <!--/tc:head-->

    <!-- Disable phone number detection -->
    <meta name="format-detection" content="telephone=no" />
    <!-- system fonts; no CDN (a PWA that installs should not depend on another host for its type) -->

    <!-- The reader's theme, painted before the app loads so a dark theme never flashes light
         (the kit's lib/theme.ts keeps this copy current). -->
    <script>try{var c=localStorage.getItem("tinypeek:theme-css");if(c){var s=document.createElement("style");s.id="tc-theme";s.textContent=c;document.head.appendChild(s)}}catch(e){}</script>

    <!-- Safe area CSS variables -->
    <style>
      :root {
        --sat: env(safe-area-inset-top);
        --sar: env(safe-area-inset-right);
        --sab: env(safe-area-inset-bottom);
        --sal: env(safe-area-inset-left);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
